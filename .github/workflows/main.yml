name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install gomobile (sagernet version)
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@latest
          gomobile init

      - name: Build libbox.aar using official script
        run: |
          git clone https://github.com/SagerNet/sing-box.git
          cd sing-box
          git checkout v1.14.0-rc.1
          go run ./cmd/internal/build_libbox -target android
          # The script places the AAR in the root
          if [ -f libbox.aar ]; then
            mkdir -p ../app/libs
            cp libbox.aar ../app/libs/
          else
            # Fallback: search for it
            AAR=$(find . -name "*.aar" | head -n 1)
            if [ -n "$AAR" ]; then
              mkdir -p ../app/libs
              cp "$AAR" ../app/libs/libbox.aar
            else
              echo "No AAR found"
              exit 1
            fi
          fi

      - name: Verify libbox.aar
        run: ls -la app/libs/libbox.aar

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Gtunnel-Debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14