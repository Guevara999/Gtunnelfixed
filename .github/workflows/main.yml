name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      # Download sing-box binary for arm64-v8a (change to armeabi-v7a if needed)
      - name: Download sing-box binary
        run: |
          mkdir -p app/src/main/assets
          # Use the latest stable version (e.g., 1.10.0)
          VERSION="1.10.0"
          URL="https://github.com/SagerNet/sing-box/releases/download/v${VERSION}/sing-box-${VERSION}-android-arm64.zip"
          wget -q $URL -O sing-box.zip
          unzip -j sing-box.zip sing-box -d app/src/main/assets/
          chmod +x app/src/main/assets/sing-box
          # Ensure executable permission is preserved in Git (if you commit)
          git update-index --chmod=+x app/src/main/assets/sing-box

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Gtunnel-Debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14