name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Build libbox.aar (sing‑box v1.10.0)
        run: |
          # Full clone to ensure we get the tag
          git clone https://github.com/SagerNet/sing-box.git
          cd sing-box
          git checkout v1.10.0
          go mod tidy
          go get -tool golang.org/x/mobile/cmd/gobind
          gomobile bind -target=android -androidapi 21 -o libbox.aar ./experimental/libbox
          mkdir -p ../app/libs
          cp libbox.aar ../app/libs/

      - name: Verify libbox.aar
        run: ls -la app/libs/libbox.aar

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Gtunnel-Debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14