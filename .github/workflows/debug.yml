name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Build libbox.aar (armeabi-v7a + arm64-v8a only)
        run: |
          git clone https://github.com/SagerNet/sing-box.git
          cd sing-box
          git checkout v1.14.0-rc.1
          go run ./cmd/internal/build_libbox -target android/arm,android/arm64
          # List files to debug
          echo "Files in current directory:"
          ls -la
          echo "Files in build/ (if exists):"
          ls -la build/ 2>/dev/null || echo "build/ not found"
          # Find .aar file
          AAR_FILE=$(find . -name "*.aar" | head -n 1)
          if [ -n "$AAR_FILE" ]; then
            echo "Found AAR: $AAR_FILE"
            mkdir -p ../app/libs
            cp "$AAR_FILE" ../app/libs/libbox.aar
          else
            echo "No .aar file found. Aborting."
            exit 1
          fi

      - name: Verify libbox.aar
        run: ls -la app/libs/libbox.aar

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Gtunnel-Debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14