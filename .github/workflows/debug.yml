name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Download libbox.aar
        run: |
          mkdir -p app/libs
          # Try official release from sing-box-lx (reliable)
          wget -O app/libs/libbox.aar https://github.com/Leadaxe/sing-box-lx/releases/download/v1.13.19/libbox.aar || \
          # Fallback to Leadaxe/LxBox raw file
          wget -O app/libs/libbox.aar https://raw.githubusercontent.com/Leadaxe/LxBox/main/app/libs/libbox.aar || \
          # If both fail, we'll build from source (see alternative below)
          echo "Failed to download libbox.aar; building from source will be attempted."

      - name: Build libbox.aar from source (if download failed)
        if: steps.download.outputs.status == 'failure'
        run: |
          sudo apt-get update && sudo apt-get install -y golang-go
          git clone https://github.com/SagerNet/sing-box.git
          cd sing-box
          go run ./cmd/internal/build_libbox -target android -platform android/arm,android/arm64
          cp libbox.aar ../app/libs/

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14