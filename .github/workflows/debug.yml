name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      # Download and extract sing-box CLI binary (arm64)
      - name: Download and extract sing-box binary
        run: |
          mkdir -p app/src/main/assets
          VERSION="1.13.14"
          URL="https://github.com/SagerNet/sing-box/releases/download/v${VERSION}/sing-box-${VERSION}-android-arm64.tar.gz"
          wget -L -q --show-progress $URL -O sing-box.tar.gz
          tar -xzf sing-box.tar.gz
          # The binary is inside a directory named like "sing-box-${VERSION}-android-arm64"
          if [ -f "sing-box-${VERSION}-android-arm64/sing-box" ]; then
            cp "sing-box-${VERSION}-android-arm64/sing-box" app/src/main/assets/
          else
            # Fallback: find it anywhere
            find . -name sing-box -exec cp {} app/src/main/assets/ \;
          fi
          chmod +x app/src/main/assets/sing-box
          ls -la app/src/main/assets/

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Gtunnel-Debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14